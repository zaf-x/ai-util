[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-util"
dynamic = ["version"]
description = 'A practical OOP-style AI wrapper toolkit based on OpenAI SDK. Features streaming + tool calls simultaneously.'
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["ai", "openai", "chatgpt", "llm", "gpt", "deepseek", "tool-use", "function-calling", "stream"]
authors = [
  { name = "BaoShuWen", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "openai>=1.0.0",
  "requests>=2.26.0",
]

[project.scripts]
ai-chat = "ai_util.cli:main"

[project.optional-dependencies]
cli = [
  "rich>=13.0.0",
  "tomli>=1.1.0; python_version < '3.11'",
]

[project.urls]
Documentation = "https://github.com/BaoShuWen/ai-util#readme"
Issues = "https://github.com/BaoShuWen/ai-util/issues"
Source = "https://github.com/BaoShuWen/ai-util"

[tool.hatch.version]
path = "src/ai_util/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/ai_util tests}"

[tool.coverage.run]
source_pkgs = ["ai_util", "tests"]
branch = true
parallel = true
omit = [
  "src/ai_util/__about__.py",
]

[tool.coverage.paths]
ai_util = ["src/ai_util", "*/ai-util/src/ai_util"]
tests = ["tests", "*/ai-util/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
